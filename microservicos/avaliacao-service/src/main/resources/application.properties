# Porta do microserviço
server.port=8082

# Nome do serviço
spring.application.name=avaliacao-service

# Banco H2 (banco separado do matricula-service)
spring.datasource.url=jdbc:h2:mem:avaliacaodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console H2 (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Microserviços externos
pessoa.service.url=http://localhost:8085
disciplina.service.url=http://localhost:8084