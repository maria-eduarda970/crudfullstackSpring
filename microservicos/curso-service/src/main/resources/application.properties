# Porta do microserviço
server.port=8083

# Nome do serviço
spring.application.name=curso-service

# Banco H2 (banco exclusivo do curso-service)
spring.datasource.url=jdbc:h2:mem:cursodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console H2 (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Microserviços externos
professor.service.url=http://localhost:8086